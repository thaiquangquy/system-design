events {}

http {
    upstream url_shortener_app {
        server url-shortener-1:8080;
        server url-shortener-2:8080;
        # A host-run instance (e.g. debugging in IntelliJ) joining the sharded topology locally —
        # see the "Running sharded" section of url-shortener/README.md.
        server host.docker.internal:8080 down; # remove `down` when you want to debug locally with sharded-local profile
    }

    server {
        listen 80;

        location / {
            proxy_pass http://url_shortener_app;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }
    }
}
