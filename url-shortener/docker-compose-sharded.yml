services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "16379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres-idgen:
    image: postgres:16-alpine
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    volumes:
      - ./postgres-init/idgen-schema.sql:/docker-entrypoint-initdb.d/idgen-schema.sql:ro
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "urlshortener" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  shard0-primary:
    image: postgres:16-alpine
    ports:
      - "25433:5432"
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
      # Local demo only: trust auth keeps replication + app connections simple without a
      # separate replication role/password. Do not do this in a real deployment.
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby=on
    volumes:
      - ./postgres-init/pg-hba-replication.sh:/docker-entrypoint-initdb.d/pg-hba-replication.sh:ro
      - ./postgres-init/shard-schema.sql:/docker-entrypoint-initdb.d/shard-schema.sql:ro
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "urlshortener" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  shard0-replica:
    image: postgres:16-alpine
    ports:
      - "25434:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: shard0-primary
      PGUSER: urlshortener
    volumes:
      - ./postgres-init/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: [ "bash", "/replica-entrypoint.sh" ]
    depends_on:
      shard0-primary:
        condition: service_healthy

  shard1-primary:
    image: postgres:16-alpine
    ports:
      - "25435:5432"
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby=on
    volumes:
      - ./postgres-init/pg-hba-replication.sh:/docker-entrypoint-initdb.d/pg-hba-replication.sh:ro
      - ./postgres-init/shard-schema.sql:/docker-entrypoint-initdb.d/shard-schema.sql:ro
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "urlshortener" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  shard1-replica:
    image: postgres:16-alpine
    ports:
      - "25436:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: shard1-primary
      PGUSER: urlshortener
    volumes:
      - ./postgres-init/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: [ "bash", "/replica-entrypoint.sh" ]
    depends_on:
      shard1-primary:
        condition: service_healthy

  url-shortener-1:
    build: ./url-shortener
    environment:
      SPRING_PROFILES_ACTIVE: sharded
      DB_HOST: postgres-idgen
      DB_NAME: urlshortener
      DB_USER: urlshortener
      DB_PASSWORD: urlshortener
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BASE_URL: http://localhost
    depends_on:
      postgres-idgen:
        condition: service_healthy
      shard0-replica:
        condition: service_started
      shard1-replica:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  url-shortener-2:
    build: ./url-shortener
    environment:
      SPRING_PROFILES_ACTIVE: sharded
      DB_HOST: postgres-idgen
      DB_NAME: urlshortener
      DB_USER: urlshortener
      DB_PASSWORD: urlshortener
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BASE_URL: http://localhost
    depends_on:
      postgres-idgen:
        condition: service_healthy
      shard0-replica:
        condition: service_started
      shard1-replica:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      url-shortener-1:
        condition: service_healthy
      url-shortener-2:
        condition: service_healthy
